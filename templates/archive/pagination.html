{% if page_obj.paginator.num_pages > 1 %}<nav class="pagination"><a href="?page=1">首页</a>{% if page_obj.has_previous %}<a href="?page={{ page_obj.previous_page_number }}">←</a>{% endif %}<span>{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a href="?page={{ page_obj.next_page_number }}">→</a>{% endif %}<a href="?page={{ page_obj.paginator.num_pages }}">尾页</a><form><input name="page" type="number" min="1" max="{{ page_obj.paginator.num_pages }}" placeholder="页码"><button>跳转</button></form></nav>{% endif %}
